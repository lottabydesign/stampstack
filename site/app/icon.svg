<!-- Favicon: the stampstack 3D mark. Next.js App Router auto-serves app/icon.svg
     and injects the <link rel="icon"> tags. The artwork is the brand logo, kept
     intact; only the outer <svg> is reframed to a square viewBox (centered on the
     art, with padding) so the tall portrait mark renders square without the
     stretch that preserveAspectRatio="none" would cause. Fill falls back to the
     brand blue when the CSS var isn't defined (i.e. everywhere outside the app). -->
